name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run icon
      # 在 Windows 上打包可以给 Clawd.exe 换上自己的图标(signAndEditExecutable=true)
      - run: npx electron-builder --win --x64 -c.win.signAndEditExecutable=true
      - name: Make full zip + light update zip
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item README.md dist/win-unpacked/使用说明.md
          Copy-Item -Recurse browser-extension dist/win-unpacked/browser-extension
          Compress-Archive -Path dist/win-unpacked -DestinationPath "dist/Clawd-v$v-win-x64.zip"
          python scripts/make_update.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Clawd-v*-win-x64.zip
            dist/Clawd-update-v*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: clawd-windows
          path: |
            dist/Clawd-v*-win-x64.zip
            dist/Clawd-update-v*.zip
