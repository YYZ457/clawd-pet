<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>和 Clawd 说话</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<style>
  :root { --o: #D97757; --ink: #3a2a22; --bg: #fffdf8; }
  html, body { margin: 0; height: 100%; background: transparent; font: 13px/1.4 "Microsoft YaHei UI","PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif; color: var(--ink); user-select: none; overflow: hidden; }
  .card { box-sizing: border-box; margin: 6px; height: calc(100% - 12px); background: var(--bg); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 rgba(58,42,34,.25); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
  .top small { font-weight: 500; opacity: .6; margin-left: 6px; }
  button { font: inherit; cursor: pointer; }
  .gear { border: 0; background: none; font-size: 15px; padding: 0 2px; opacity: .65; }
  .gear:hover { opacity: 1; }
  .row { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 7px 9px; border: 2px solid var(--ink); border-radius: 9px; background: #fff; color: var(--ink); outline: none; user-select: text; }
  input:focus { border-color: var(--o); }
  .go { border: 2px solid var(--ink); border-radius: 9px; background: var(--o); color: #fff; font-weight: 700; padding: 0 12px; }
  .go:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1.5px solid var(--ink); border-radius: 999px; background: #fff3ea; padding: 2px 9px; font-size: 12px; color: var(--ink); }
  .chip:hover { background: #ffe3d2; }
  .lab { font-size: 11px; opacity: .6; margin-top: 2px; }
  .status { font-size: 11.5px; min-height: 16px; opacity: .85; }
  .status.err { color: #b3261e; opacity: 1; }
  .q { font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><div id="title">和 Clawd 说话<small id="quota"></small></div><button class="gear" id="gear" title="大模型设置">⚙</button></div>
  <div id="q" class="q" hidden></div>
  <div class="row"><input id="inp" maxlength="120" autocomplete="off" spellcheck="false" placeholder="演一出海盗寻宝 / 学个害羞转圈的动作 / 随便聊聊…"><button class="go" id="send">发送</button></div>
  <div id="more">
    <div class="lab">试试这些(不需要 Key):</div>
    <div class="chips" id="builtin"></div>
    <div class="lab">给大模型的灵感:</div>
    <div class="chips" id="ideas"></div>
  </div>
  <div class="status" id="status"></div>
</div>
<script src="chat.js"></script>
</body>
</html>
