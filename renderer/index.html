<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Clawd</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; }
  #bubble {
    position: fixed; left: 0; top: 0; max-width: 240px; padding: 6px 11px; border-radius: 12px;
    background: #fffdf8; color: #3a2a22; border: 2px solid #3a2a22; box-shadow: 0 2px 0 rgba(58,42,34,.25);
    font: 600 13px/1.35 "Microsoft YaHei UI","PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif;
    pointer-events: none; opacity: 0; transition: opacity .18s; white-space: pre-wrap; will-change: transform;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; left: var(--tx, 50%); bottom: -8px; margin-left: -6px;
    border: 6px solid transparent; border-top-color: #3a2a22; border-bottom: 0;
  }
  #bubble.below::after { bottom: auto; top: -8px; border-top-color: transparent; border-bottom: 6px solid #3a2a22; border-top: 0; }
  #bubble.term { background: #1e1b1a; color: #f0e6df; border-color: #D97757; font-family: Consolas,"Cascadia Mono",monospace; font-weight: 500; }
  #bubble.term::after { border-top-color: #D97757; }
  #bubble.term .o { color: #D97757; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubble"></div>
<script src="rig.js"></script>
<script src="life.js"></script>
<script src="brain.js"></script>
</body>
</html>
